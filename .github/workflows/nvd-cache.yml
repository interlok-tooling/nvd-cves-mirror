name: NVD API Cache
on:
  schedule:
    - cron:  0 */8 * * * # Every 8 hours
  workflow_dispatch:
  # Needed so we can run it manually

jobs:
  build:
    permissions:
      contents: write
    name: Update NVD API Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: nvd-cache
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: update
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          JAVA_OPTS: "-Xmx4g -XX:+UseStringDeduplication"
        run: |
          curl https://github.com/jeremylong/Open-Vulnerability-Project/releases/download/v6.1.7/vulnz-6.1.7.jar -s -L -o vulnz.jar
          git reset --soft HEAD~1
          ls -la .

          MAX_ATTEMPTS=10
          ATTEMPT=1
          while true; do
            echo "[Attempt $ATTEMPT/$MAX_ATTEMPTS] Running vulnz..."
            if java -jar vulnz.jar cve --cache --directory ./nvd_api_cache --threads=1 --debug --delay=8000; then
              echo "vulnz succeeded on attempt $ATTEMPT."
              break
            else
              if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
                echo "Max retry attempts ($MAX_ATTEMPTS) reached. Giving up."
                exit 1
              fi
              echo "vulnz failed (exit code $?). Retrying in 30 seconds..."
              sleep 30
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

          rm vulnz.jar
          git status
          cat nvd_api_cache/cache.properties
          git config user.name "Interlok Dev"
          git config user.email "<>"
          git add ./nvd_api_cache/
          git commit -am 'chore: update'
          git push origin nvd-cache --force