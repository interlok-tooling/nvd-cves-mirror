name: NVD API Cache VulnCheck Canary
on:
  schedule:
    - cron: '0 */8 * * *' # Every 8 hours
  workflow_dispatch:
  # Manual runs are the main path while this lives on a non-default branch.

# This workflow builds a Dependency Check-compatible canary feed from
# VulnCheck NVD++ and publishes it to the nvd-cache-vulncheck branch.

jobs:
  build:
    permissions:
      contents: write
    name: Update VulnCheck Canary Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Dependency Check-compatible canary feed
        env:
          VULNCHECK_API_TOKEN: ${{ secrets.VULNCHECK_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${VULNCHECK_API_TOKEN:-}" ]; then
            echo "VULNCHECK_API_TOKEN is not configured."
            exit 1
          fi

          OUTPUT_BRANCH="nvd-cache-vulncheck"
          WORK_DIR="$(mktemp -d)"
          OUTPUT_WORKTREE="${WORK_DIR}/output-branch"
          GENERATED_DIR="${WORK_DIR}/generated"
          DOWNLOAD_DIR="${WORK_DIR}/downloads"
          PREVIOUS_CACHE_DIR=""

          if git ls-remote --exit-code --heads origin "${OUTPUT_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${OUTPUT_BRANCH}:${OUTPUT_BRANCH}"
            git worktree add "${OUTPUT_WORKTREE}" "${OUTPUT_BRANCH}"
            PREVIOUS_CACHE_DIR="${OUTPUT_WORKTREE}/nvd_api_cache"
          else
            git worktree add --detach "${OUTPUT_WORKTREE}"
            (
              cd "${OUTPUT_WORKTREE}"
              git checkout --orphan "${OUTPUT_BRANCH}"
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          if [ -n "${PREVIOUS_CACHE_DIR}" ] && [ -d "${PREVIOUS_CACHE_DIR}" ]; then
            python scripts/convert_vulncheck_feed.py \
              --api-token "${VULNCHECK_API_TOKEN}" \
              --download-dir "${DOWNLOAD_DIR}" \
              --output-dir "${GENERATED_DIR}" \
              --previous-cache-dir "${PREVIOUS_CACHE_DIR}" \
              --branch-readme-mode canary
          else
            python scripts/convert_vulncheck_feed.py \
              --api-token "${VULNCHECK_API_TOKEN}" \
              --download-dir "${DOWNLOAD_DIR}" \
              --output-dir "${GENERATED_DIR}" \
              --branch-readme-mode canary
          fi

          cd "${OUTPUT_WORKTREE}"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${GENERATED_DIR}/nvd_api_cache" .
          cp "${GENERATED_DIR}/README.md" .

          echo "Canary feed contents prepared."
          ls -lh ./nvd_api_cache/ | sed -n '1,20p'

          git config user.name "Interlok Dev"
          git config user.email "<>"
          git add ./nvd_api_cache/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m 'chore: update vulncheck canary cache'
          git push origin HEAD:${OUTPUT_BRANCH} --force-with-lease
