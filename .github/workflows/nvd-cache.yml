name: NVD API Cache
on:
  schedule:
    - cron: '0 */8 * * *' # Every 8 hours
  workflow_dispatch:
  # Needed so we can run it manually

# CVE data sourced from VulnCheck NVD++ (https://vulncheck.com/nvd2)
# A free community service provided by VulnCheck Inc.

jobs:
  build:
    permissions:
      contents: write
    name: Update NVD API Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: nvd-cache
      - name: Download NVD cache from VulnCheck NVD++
        env:
          VULNCHECK_API_TOKEN: ${{ secrets.VULNCHECK_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${VULNCHECK_API_TOKEN:-}" ]; then
            echo "VULNCHECK_API_TOKEN is not configured."
            exit 1
          fi

          git reset --soft HEAD~1

          echo "Fetching backup index from VulnCheck NVD++..."
          BACKUP_INDEX=$(curl -sf \
            --url https://api.vulncheck.com/v3/backup/nist-nvd2 \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${VULNCHECK_API_TOKEN}")

          echo "Clearing existing cache..."
          rm -rf ./nvd_api_cache
          mkdir -p ./nvd_api_cache

          echo "Downloading backup files..."
          echo "$BACKUP_INDEX" | \
            jq -r '.data[].url' | \
            while read -r url; do
              echo "Downloading: $url"
              filename=$(basename "$url")
              curl -sf \
                --header "Authorization: Bearer ${VULNCHECK_API_TOKEN}" \
                -o "./nvd_api_cache/${filename}" \
                "$url"
            done

          cat <<'EOF' > README.md
          ## Data Source

          CVE data in this cache is sourced from [VulnCheck NVD++](https://vulncheck.com/nvd2),
          a free community service provided by VulnCheck Inc., which provides reliable access
          to NIST National Vulnerability Database (NVD) data.

          Original CVE data © NIST National Vulnerability Database (https://nvd.nist.gov).
          EOF

          echo "Download complete."
          ls -lh ./nvd_api_cache/

          git config user.name "Interlok Dev"
          git config user.email "<>"
          git add ./nvd_api_cache/ README.md
          git commit -m 'chore: update' || echo "No changes to commit."
          git push origin nvd-cache --force
